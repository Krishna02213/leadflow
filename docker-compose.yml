services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leadflow
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: leadflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://leadflow:leadflow@db:5432/leadflow
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-use-32-characters}
      CORS_ORIGINS: http://localhost:3000
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-demo@leadflow.dev}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-demo1234}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
