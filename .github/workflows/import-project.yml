name: Import LeadFlow source

on:
  push:
    paths:
      - leadflow-source.zip

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack validated project source
        run: |
          unzip -o leadflow-source.zip
          rm leadflow-source.zip
          rm .github/workflows/import-project.yml
      - name: Commit application tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import complete LeadFlow application'
          git push
