name: Import LeadFlow source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated project source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.0 --pattern leadflow-source.zip
      - name: Unpack validated project source
        run: |
          unzip -o leadflow-source.zip
          rm leadflow-source.zip
          rm .github/workflows/import-project.yml
      - name: Commit application tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import complete LeadFlow application'
          git push
